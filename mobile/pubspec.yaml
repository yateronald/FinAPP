name: fintrack
description: "FinTrack — AI Personal Finance. Premium mobile app (Android & iOS)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2

  # Networking
  dio: ^5.7.0

  # Navigation
  go_router: ^17.3.0

  # Secure storage & local persistence
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Connectivity (offline sync)
  connectivity_plus: ^7.3.0

  # Security
  local_auth: ^3.0.2
  screen_protector: ^1.4.2

  # UI / design
  google_fonts: ^8.2.0
  fl_chart: ^1.2.0
  flutter_svg: ^2.0.16
  flutter_markdown: ^0.7.4+3
  intl: ^0.20.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^2.0.1
  # Firebase & Notifications
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "img/logo_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "img/logo_icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - img/
